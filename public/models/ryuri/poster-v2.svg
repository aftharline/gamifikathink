<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
  </g>

  <!-- Central Glow -->
  <circle cx="400" cy="380" r="280" fill="url(#glowGrad)" />

  <!-- Outer Geometric Rings -->
  <circle cx="400" cy="380" r="240" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" stroke-dasharray="10 15" />
  <circle cx="400" cy="380" r="180" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.8" />
  <circle cx="400" cy="380" r="120" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.7" stroke-dasharray="5 10" />

  <!-- Central Dragon / Spirit Emblem Silhouette -->
  <g transform="translate(400, 370) scale(1.4)">
    <!-- Wings left & right -->
    <path d="M 0,-60 Q -80,-110 -130,-40 Q -90,-10 -60,20 Q -30,0 0,-60 Z" fill="#38bdf8" opacity="0.9" />
    <path d="M 0,-60 Q 80,-110 130,-40 Q 90,-10 60,20 Q 30,0 0,-60 Z" fill="#38bdf8" opacity="0.9" />
    <!-- Inner wing accents -->
    <path d="M 0,-50 Q -60,-80 -95,-30 Q -65,-10 -40,15 Z" fill="#e0f2fe" opacity="0.7" />
    <path d="M 0,-50 Q 60,-80 95,-30 Q 65,-10 40,15 Z" fill="#e0f2fe" opacity="0.7" />
    <!-- Dragon Head & Horns -->
    <path d="M 0,-90 L -15,-60 L -30,-80 L -10,-45 L -20,-30 L 0,-15 L 20,-30 L 10,-45 L 30,-80 L 15,-60 Z" fill="#ffffff" />
    <!-- Eyes -->
    <circle cx="-8" cy="-45" r="4" fill="#38bdf8" />
    <circle cx="8" cy="-45" r="4" fill="#38bdf8" />
    <!-- Body & Tail -->
    <path d="M 0,-15 L -20,30 L -10,70 L 0,100 L 10,70 L 20,30 Z" fill="#cbd5e1" />
    <path d="M 0,100 Q 20,130 40,140 Q 20,145 0,120 Z" fill="#ec4899" />
  </g>

  <!-- Sparkles & Particles -->
  <circle cx="250" cy="220" r="4" fill="#ffffff" />
  <circle cx="560" cy="200" r="5" fill="#38bdf8" />
  <circle cx="180" cy="480" r="3" fill="#ec4899" />
  <circle cx="620" cy="500" r="4" fill="#a855f7" />
  <circle cx="390" cy="180" r="6" fill="#ffffff" />

  <!-- SPECIAL CATEGORY BADGE -->
  <rect x="260" y="650" width="280" height="44" rx="22" fill="url(#badgeGrad)" />
  <text x="400" y="678" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" letter-spacing="3">SPECIAL EDITION</text>

  <!-- TITLE OVERLAY -->
  <text x="400" y="735" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="900" letter-spacing="2">RYURI SPIRIT</text>

  <!-- Border Frame -->
  <rect x="10" y="10" width="780" height="780" rx="24" fill="none" stroke="url(#cardBorder)" stroke-width="6" opacity="0.8" />
</svg>